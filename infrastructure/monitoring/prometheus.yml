global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-scrape
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AeroPredict FastAPI Backend
  - job_name: 'aeropredict_api'
    static_configs:
      - targets: ['fastapi:8000']  # Docker service name
    metrics_path: '/metrics'
    scrape_interval: 15s

  # MLflow Tracking Server
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Airflow (optional - if exposing metrics)
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter (host metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Docker container stats (via cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

# Alerting rules
rule_files:
  - "alert_rules.yml"

# Storage
# Retention and WAL compression are command-line flags, not config-file
# options: Prometheus rejects `retention` with "cannot unmarshal !!str `15d`
# into config.plain" and `wal_compression` with "field wal_compression not
# found". They are set via --storage.tsdb.retention.time and
# --storage.tsdb.wal-compression in docker-compose.yml instead.