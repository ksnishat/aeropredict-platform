groups:
  - name: AeroPredict Alerts
    rules:
      # High error rate. The metric name must match what the API actually
      # exposes; a wrong name makes the rule silently never fire.
      - alert: HighErrorRate
        expr: rate(aeropredict_predictions_total{status="error"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on AeroPredict API"
          description: "Error rate is {{ $value | humanizePercentage }} over 5m window"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(aeropredict_prediction_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on AeroPredict API"
          description: "P95 latency is {{ $value }}s over 5m window"

      # Model not loaded
      - alert: ModelNotLoaded
        expr: aeropredict_model_loaded == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AeroPredict model not loaded"
          description: "The model is not loaded, predictions will fall back or fail"

      # Airflow DAG failure — requires the statsd_exporter service defined in
      # docker-compose.yml, which translates Airflow StatsD UDP traffic into
      # Prometheus metrics using infrastructure/monitoring/statsd_mapping.yml.
      #
      # Metric: airflow_dagrun_failed_total is a counter emitted by Airflow 2.7+
      # via StatsD whenever a DAG run transitions to the "failed" state.
      # The statsd_mapping.yml labels it with {dag_id}. Any non-zero rate over
      # 5 minutes means at least one run failed in that window.
      #
      # Previous rule used `airflow_dag_run_state == 0` — a metric nothing
      # exported (Airflow's web UI at :8080 is not a Prometheus endpoint).
      - alert: AirflowDAGFailure
        expr: increase(airflow_dagrun_state{state="failed"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Airflow DAG run failed in {{ $labels.dag_id }}"
          description: "{{ $value }} failed run(s) detected for dag_id={{ $labels.dag_id }} in the last 5 minutes."

      # Feature drift. PSI is computed against the training baseline; 0.25 is
      # the conventional "significant shift" threshold. Without this rule the
      # drift gauge is measured but nothing acts on it.
      - alert: FeatureDriftDetected
        expr: aeropredict_max_drift_psi > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "AeroPredict input distribution has shifted"
          description: "PSI is {{ $value }} (threshold 0.25). The model is seeing data unlike its training set."
