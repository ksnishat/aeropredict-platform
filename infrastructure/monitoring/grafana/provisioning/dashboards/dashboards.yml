apiVersion: 1

# The dashboards are mounted at /var/lib/grafana/dashboards (see the grafana
# service in docker-compose.yml and start_grafana in run_stack.sh). The old
# config pointed at /etc/grafana/provisioning/dashboards/<project>, which was
# never mounted, so Grafana started with zero dashboards.
providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
