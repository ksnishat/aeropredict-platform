# TLS termination for the aeropredict API.
#
# One server block, because this repository is self-contained: it terminates
# TLS for its own API only. The workspace root has a combined proxy that covers
# all four projects when they run side by side.
#
# The upstream uses host.docker.internal because the API runs on the host, not
# in a container.
#
# This is a demo proxy: self-signed certificate, no client-cert auth. A real
# deployment would terminate TLS at the load balancer with a CA-issued cert.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Do not advertise the nginx version.
    server_tokens off;

    # The API caps uploads at 10 MiB; allow headroom so the API returns its own
    # 413 rather than nginx returning a bare one.
    client_max_body_size 12m;

    # HSTS is omitted on purpose: it would pin a self-signed certificate in the
    # browser and break the other local stacks.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # LLM-backed reports take seconds; the default 60s is too tight under load.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / { proxy_pass http://host.docker.internal:8000; }
    }
}
