version: '3.8'

services:
  # ==========================================
  # 1. DATABASE (Metadata Store)
  # ==========================================
  postgres:
    image: postgres:15
    container_name: aeropredict_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 2. OBJECT STORAGE (MinIO - S3 Compatible)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: aeropredict_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 3. EXPERIMENT TRACKING (MLflow)
  # ==========================================
  mlflow:
    image: ghcr.io/aeropredict/mlflow:latest
    container_name: aeropredict_mlflow
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://airflow:airflow@postgres:5432/airflow
      - ARTIFACT_STORE_URI=s3://mlflow/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "sleep 5 && mlflow server --backend-store-uri postgresql://airflow:airflow@postgres:5432/airflow --default-artifact-root s3://mlflow/ --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 4. ORCHESTRATION (Airflow)
  # ==========================================
  airflow-webserver:
    image: ghcr.io/aeropredict/airflow:latest
    container_name: aeropredict_airflow_webserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - MINIO_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      - ./Aircraft-Engine-Failure-Prediction-using-Deep-Learning-main/CMAPSSData:/opt/airflow/data
      # Named volume, not a bind mount: a host ./logs directory owned by
      # root is not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aeropredict-network

  airflow-scheduler:
    image: ghcr.io/aeropredict/airflow:latest
    container_name: aeropredict_airflow_scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - MINIO_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      - ./Aircraft-Engine-Failure-Prediction-using-Deep-Learning-main/CMAPSSData:/opt/airflow/data
      # Named volume, not a bind mount: a host ./logs directory owned by
      # root is not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      - airflow-webserver
    networks:
      - aeropredict-network

  # ==========================================
  # 5. MONITORING STACK (Grafana + Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aeropredict_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: aeropredict_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - aeropredict-network

  grafana:
    image: grafana/grafana:latest
    container_name: aeropredict_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aeropredict
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 6. USER INTERFACE (FastAPI + Streamlit)
  # ==========================================
  fastapi:
    image: ghcr.io/aeropredict/api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aeropredict_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - aeropredict_models:/app/models
    environment:
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aeropredict-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  streamlit:
    image: ghcr.io/aeropredict/api:latest
    container_name: aeropredict_ui
    working_dir: /app
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://fastapi:8000/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

networks:
  aeropredict-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  prometheus_data:
  aeropredict_models:
  airflow_logs: