services:
  # ==========================================
  # 1. DATABASE (Metadata Store)
  # ==========================================
  postgres:
    image: postgres:15
    container_name: aeropredict_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 2. OBJECT STORAGE (MinIO - S3 Compatible)
  # ==========================================
  minio:
    # minio/minio was removed from Docker Hub (pull access denied), so use the
    # Bitnami legacy image. It defaults to uid 1001, which cannot write to a
    # named volume created by an older root-owned container, hence user: root.
    # The explicit command is required: Bitnami's own run.sh does not bind the
    # console port, so the console would be unreachable without it.
    image: bitnamilegacy/minio:latest
    user: root
    container_name: aeropredict_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 3. EXPERIMENT TRACKING (MLflow)
  # ==========================================
  mlflow:
    image: ghcr.io/aeropredict/mlflow:latest
    container_name: aeropredict_mlflow
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://airflow:airflow@postgres:5432/airflow
      - ARTIFACT_STORE_URI=s3://mlflow/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "sleep 5 && mlflow server --backend-store-uri postgresql://airflow:airflow@postgres:5432/airflow --default-artifact-root s3://mlflow/ --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 4. ORCHESTRATION (Airflow)
  # ==========================================
  airflow-webserver:
    image: ghcr.io/aeropredict/airflow:latest
    container_name: aeropredict_airflow_webserver
    # Run as the host user with GID 0. The Airflow image requires GID 0,
    # and the default uid 50000 cannot write to the host-owned bind
    # mounts — which is why publishing retrained weights failed with
    # Permission denied.
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # StatsD metrics export — feeds the statsd_exporter service which
      # Prometheus then scrapes. Without these vars the AirflowDAGFailure
      # alert has no data to evaluate.
      - AIRFLOW__METRICS__STATSD_ON=True
      - AIRFLOW__METRICS__STATSD_HOST=statsd_exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - KNOWLEDGE_BASE_PATH=/opt/airflow/knowledge_base/turbofan_maintenance.txt
      - CHROMA_PERSIST_DIR=/opt/airflow/chroma
      - MINIO_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      # The RAG module resolves KNOWLEDGE_BASE_PATH relative to the working
      # directory, so the knowledge base must be mounted too.
      - ./knowledge_base:/opt/airflow/knowledge_base
      - ./Aircraft-Engine-Failure-Prediction-using-Deep-Learning-main/CMAPSSData:/opt/airflow/data
      # Named volume, not a bind mount: a host ./logs directory owned by
      # root is not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
      # Training exports the TorchScript model and scaler here. ./src is a
      # read-only bind mount, so the exports need their own writable volume.
      # Bind mount, not a named volume: run_stack.sh starts the API on the
      # host reading ./models, so a named volume would put the retrained
      # checkpoint somewhere the API cannot see — the retrain would
      # succeed and serving would not change.
      - ./models:/opt/airflow/models
    ports:
      # 8081, not 8080: the documented port map reserves 8080 elsewhere and
      # every README and the system-design guide reference 8081.
      - "8081:8080"
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aeropredict-network

  airflow-scheduler:
    image: ghcr.io/aeropredict/airflow:latest
    container_name: aeropredict_airflow_scheduler
    # Run as the host user with GID 0. The Airflow image requires GID 0,
    # and the default uid 50000 cannot write to the host-owned bind
    # mounts — which is why publishing retrained weights failed with
    # Permission denied.
    user: "${AIRFLOW_UID:-1000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # StatsD metrics export — feeds the statsd_exporter service which
      # Prometheus then scrapes. Without these vars the AirflowDAGFailure
      # alert has no data to evaluate.
      - AIRFLOW__METRICS__STATSD_ON=True
      - AIRFLOW__METRICS__STATSD_HOST=statsd_exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - KNOWLEDGE_BASE_PATH=/opt/airflow/knowledge_base/turbofan_maintenance.txt
      - CHROMA_PERSIST_DIR=/opt/airflow/chroma
      - MINIO_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      # The retraining DAG calls /admin/reload-model and /monitoring, both of
      # which enforce X-API-Key. Without this the DAG got a 401 and failed.
      # Must match the API_KEY the serving API was started with.
      - API_KEY=${API_KEY:-demo-secret-key}
    volumes:
      - ./dags:/opt/airflow/dags
      # Mount src OUTSIDE the dags directory. Airflow scans everything under
      # /opt/airflow/dags for DAG files, so mounting src there makes it try to
      # parse every project module as a DAG and report import errors.
      - ./src:/opt/airflow/src
      # The RAG module resolves KNOWLEDGE_BASE_PATH relative to the working
      # directory, so the knowledge base must be mounted too.
      - ./knowledge_base:/opt/airflow/knowledge_base
      - ./Aircraft-Engine-Failure-Prediction-using-Deep-Learning-main/CMAPSSData:/opt/airflow/data
      # Named volume, not a bind mount: a host ./logs directory owned by
      # root is not writable by the airflow user and Airflow fails to start.
      - airflow_logs:/opt/airflow/logs
      # Training exports the TorchScript model and scaler here. ./src is a
      # read-only bind mount, so the exports need their own writable volume.
      # Bind mount, not a named volume: run_stack.sh starts the API on the
      # host reading ./models, so a named volume would put the retrained
      # checkpoint somewhere the API cannot see — the retrain would
      # succeed and serving would not change.
      - ./models:/opt/airflow/models
    command: scheduler
    depends_on:
      - airflow-webserver
    networks:
      - aeropredict-network

  # ==========================================
  # StatsD exporter — bridges Airflow's StatsD UDP metrics to Prometheus HTTP.
  # Airflow emits metrics to statsd_host:9125 (UDP). The exporter translates
  # them using statsd_mapping.yml and serves them at :9102/metrics for Prometheus
  # ---------------------------------------------------------------- streaming
  # Kafka in KRaft mode: no ZooKeeper. A single broker is enough for a
  # portfolio and keeps the stack inside the RAM budget; a 3-broker cluster
  # would add ~2 GB for no demonstrable benefit here.
  #
  # The dual listeners matter. PLAINTEXT://localhost:9094 is for clients on the
  # host (the producer and consumer run as host processes, like the API), and
  # PLAINTEXT://kafka:29092 is for anything inside the compose network. A
  # single advertised listener would make one of the two unable to connect,
  # because the broker hands the client the address it advertises.
  #
  # Port 9094, not the Kafka default 9092: 9092 is Rossmann's Prometheus port
  # in the shared stack, and the collision only surfaced when the full stack was
  # stopped and the port check failed.
  kafka:
    image: apache/kafka:3.7.0
    container_name: aeropredict_kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: aeropredict-kraft-01
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - aeropredict-network

  # Online feature store. The API reads the latest rolling window from here
  # instead of requiring the client to upload 50 cycles of CSV.
  redis:
    image: redis:7-alpine
    container_name: aeropredict_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - aeropredict-network

  # to scrape. Without this service the AirflowDAGFailure alert rule has no
  # data to evaluate and silently never fires.
  statsd_exporter:
    image: prom/statsd-exporter:v0.26.1
    container_name: aeropredict_statsd_exporter
    ports:
      - "9125:9125/udp"   # StatsD ingress from Airflow
      - "9102:9102"       # Prometheus scrape endpoint
    command:
      - "--statsd.mapping-config=/statsd_mapping.yml"
    volumes:
      - ./infrastructure/monitoring/statsd_mapping.yml:/statsd_mapping.yml:ro
    restart: unless-stopped
    networks:
      - aeropredict-network

  # 5. MONITORING STACK (Grafana + Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aeropredict_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Retention and WAL compression are CLI-only options, not
      # config-file fields, so they are set here.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.wal-compression'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: aeropredict_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - aeropredict-network

  grafana:
    image: grafana/grafana:latest
    container_name: aeropredict_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aeropredict
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      # Read by provisioning/datasources/datasources.yml. The compose
      # service is named `prometheus`; run_stack.sh overrides this with
      # the prom_<project> container name it creates instead.
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      # Without this mount Grafana starts with zero dashboards: the
      # provider in dashboards.yml points at /var/lib/grafana/dashboards.
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

  # ==========================================
  # 6. USER INTERFACE (FastAPI + Streamlit)
  # ==========================================
  fastapi:
    image: ghcr.io/aeropredict/api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: aeropredict_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      # Same volume the Airflow DAG writes its retrained checkpoint to. Using a
      # separate volume here meant "continuous learning" retrained a model that
      # was never served: the DAG wrote to airflow_models while the API read
      # aeropredict_models.
      - ./models:/app/models
    environment:
      # MLflow runs on the host (port 5001), not as a compose service, so the
      # container reaches it through the Docker gateway rather than by name.
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001
      - MODEL_PATH=/app/models/lstm_best.pt
      - SCALER_PATH=/app/models/scaler.joblib
      # Lets the retrain DAG hot-swap the served model over HTTP instead of
      # requiring an API restart.
      - ENABLE_MODEL_RELOAD=true
      - KNOWLEDGE_BASE_PATH=/opt/airflow/knowledge_base/turbofan_maintenance.txt
      - CHROMA_PERSIST_DIR=/opt/airflow/chroma
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      # The root path is the health endpoint; /health returns 404.
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - aeropredict-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  streamlit:
    image: ghcr.io/aeropredict/api:latest
    container_name: aeropredict_ui
    working_dir: /app
    command: streamlit run src/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
    environment:
      - API_URL=http://fastapi:8000/predict
      - PYTHONUNBUFFERED=1
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - aeropredict-network

networks:
  aeropredict-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  prometheus_data:
  airflow_logs:
  airflow_models:
  kafka_data:
