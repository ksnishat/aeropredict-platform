name: CI

# Run on push and pull request to main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    env:
      # Job-level, because the `secrets` context is not available in a
      # step-level `if:` expression. Setting it here lets the upload step test
      # `env.CODECOV_TOKEN` and skip cleanly when the secret is absent.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements.txt to test actual dependency resolution
          # across Python versions. The lock file is for production reproducibility.
          pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports --disallow-untyped-defs --warn-return-any || true

      - name: Security scan with bandit
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ --format txt --severity-level medium || true

      - name: Dependency vulnerability scan with pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --format=json --output=pip-audit-report.json || true
          pip-audit -r requirements.lock --desc || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not integration" --maxfail=5 --disable-warnings \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60

      # codecov-action v4 requires a token for private repositories. The
      # upload is skipped when CODECOV_TOKEN is not configured, so a fork or a
      # private clone without the secret still gets a green build — the
      # coverage gate above is what actually enforces the floor.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ matrix.python-version }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # --------------------------------------------------------------- security
  security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # --------------------------------------------------------------- shell
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: ShellCheck
        run: |
          # SC1091: sourced files are not followed (they are generated at runtime).
          # SC2317: unreachable code, triggered by the trap-based cleanup helpers.
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning --exclude=SC1091,SC2317 \
            $(git ls-files '*.sh')

  # ---------------------------------------------------------------- yaml
  yaml:
    name: YAML, JSON and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tooling
        run: pip install pyyaml

      - name: Parse every YAML file
        run: |
          # helm-chart/templates/ is excluded: those files contain Go template
          # actions and are not valid YAML until Helm renders them. The Helm
          # step below validates them properly.
          python - <<'PY'
          import subprocess, sys, yaml

          files = subprocess.run(
              ["git", "ls-files", "*.yml", "*.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          files = [f for f in files if not f.startswith("helm-chart/templates/")]

          failed = []
          for f in files:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}")
                  failed.append(f)

          if failed:
              sys.exit(f"unparseable YAML: {failed}")
          PY

      - name: Parse every JSON file
        run: |
          python - <<'PY'
          import json, subprocess, sys

          files = subprocess.run(
              ["git", "ls-files", "*.json"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = []
          for f in files:
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}")
                  failed.append(f)

          if failed:
              sys.exit(f"unparseable JSON: {failed}")
          PY

      - name: Lint and render the Helm chart
        run: |
          # `helm lint` catches schema and convention problems; `helm template`
          # actually executes the Go templates, which is the only way to catch
          # errors like a `with` block rebinding `.` to the wrong object.
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint ./helm-chart
          helm template ci-release ./helm-chart > /dev/null
          echo "helm chart renders cleanly"

      - name: Validate the TLS nginx config
        run: |
          # The certificate is generated into a temp directory rather than the
          # repo, so this check cannot clobber the committed cert.
          #
          # --add-host is required: the upstreams are host.docker.internal, and
          # nginx refuses to start when an upstream name does not resolve.
          mkdir -p /tmp/tls-check
          cp infrastructure/tls/nginx.conf /tmp/tls-check/
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "/tmp/tls-check:/etc/nginx/certs" \
            -v "/tmp/tls-check/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine sh -c '
              apk add --no-cache openssl >/dev/null 2>&1
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/nginx/certs/server.key \
                -out /etc/nginx/certs/server.crt \
                -subj "/CN=localhost" >/dev/null 2>&1
              nginx -t
            '

  # ---------------------------------------------------------------- docs
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check for stale metrics and overclaims
        run: python .github/scripts/check_docs.py

      - name: Check Grafana dashboards reference real metrics
        run: python .github/scripts/check_grafana.py

      - name: Check the repository is self-contained
        run: python .github/scripts/check_selfcontained.py

  # ------------------------------------------------------------ terraform
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # `fmt -check` catches formatting drift. `init -backend=false` resolves the
      # provider schema without contacting the Azure state backend, so this job
      # needs no cloud credentials. `validate` then type-checks every resource
      # against that schema, which is what catches a wrong argument name in a
      # module that nothing would notice until apply.
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: terraform init and validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform

  # ------------------------------------------------------------ summary
  # Single required status check. Branch protection points at this job, so
  # adding or renaming a job above never silently drops a required check.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, security, shell, yaml, docs, terraform, lockfile]
    if: always()
    steps:
      - name: Report
        run: |
          echo "test:      ${{ needs.test.result }}"
          echo "security:  ${{ needs.security.result }}"
          echo "shell:     ${{ needs.shell.result }}"
          echo "yaml:      ${{ needs.yaml.result }}"
          echo "terraform: ${{ needs.terraform.result }}"
          echo "docs:      ${{ needs.docs.result }}"
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.security.result }}" != "success" ] ||
             [ "${{ needs.shell.result }}" != "success" ] ||
             [ "${{ needs.yaml.result }}" != "success" ] ||
             [ "${{ needs.terraform.result }}" != "success" ] ||
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."

  # ---------------------------------------------------------------- lockfile
  lockfile:
    name: Lock file in sync
    runs-on: ubuntu-latest
    # Advisory, not a gate. requirements.lock is not installed by CI, the
    # Dockerfiles or the deploy path -- only pip-audit reads it -- so a drifted
    # lock has no effect on what actually ships. It drifts on every upstream
    # release because requirements.txt is unpinned, which made this job fail
    # for reasons no commit could fix. It still runs and still reports the
    # diff, so the signal is kept; it just no longer blocks a merge.
    # Re-enable as a gate once requirements.txt is pinned to exact versions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A lock file that has drifted from requirements.txt is worse than no
      # lock file: CI installs the stale pins and passes, while a fresh
      # `pip install -r requirements.txt` gets different versions. This job
      # regenerates the lock and reports any difference.
      - name: Regenerate and compare
        run: |
          python -m pip install --upgrade pip
          cp requirements.lock /tmp/committed.lock
          python tools/gen_lock.py requirements.txt requirements.lock
          if ! diff -q /tmp/committed.lock requirements.lock; then
            echo "::warning title=requirements.lock is out of date::Upstream releases moved the pins. Run: python tools/gen_lock.py requirements.txt requirements.lock"
            echo "requirements.lock is out of date."
            echo "Run: python tools/gen_lock.py requirements.txt requirements.lock"
            diff /tmp/committed.lock requirements.lock | head -40
            exit 1
          fi
          echo "requirements.lock matches requirements.txt"
