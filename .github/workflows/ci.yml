name: CI

# Run on push and pull request to main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
    env:
      # Job-level, because the `secrets` context is not available in a
      # step-level `if:` expression. Setting it here lets the upload step test
      # `env.CODECOV_TOKEN` and skip cleanly when the secret is absent.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change that was not re-locked cannot reach main. This is the
      # reproducibility gate that the old requirements.lock job was trying to
      # be: uv.lock is the actual install source, so drift here is real.
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check . --output-format=github

      - name: Type check with mypy
        run: |
          uv run --frozen mypy src/ --ignore-missing-imports --disallow-untyped-defs --warn-return-any || true

      - name: Security scan with bandit
        run: |
          uv run --frozen --with bandit bandit -r src/ -f json -o bandit-report.json || true
          uv run --frozen --with bandit bandit -r src/ --format txt --severity-level medium || true

      - name: Run tests
        run: |
          uv run --frozen python -m pytest tests/ -v --tb=short -m "not integration" --maxfail=5 --disable-warnings \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=60

      # codecov-action v4 requires a token for private repositories. The
      # upload is skipped when CODECOV_TOKEN is not configured, so a fork or a
      # private clone without the secret still gets a green build — the
      # coverage gate above is what actually enforces the floor.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ matrix.python-version }}
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # --------------------------------------------------------------- security
  security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  # --------------------------------------------------------------- shell
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit $fail

      - name: ShellCheck
        run: |
          # SC1091: sourced files are not followed (they are generated at runtime).
          # SC2317: unreachable code, triggered by the trap-based cleanup helpers.
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning --exclude=SC1091,SC2317 \
            $(git ls-files '*.sh')

  # ---------------------------------------------------------------- yaml
  yaml:
    name: YAML, JSON and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install tooling
        run: uv sync --frozen

      - name: Parse every YAML file
        run: |
          # helm-chart/templates/ is excluded: those files contain Go template
          # actions and are not valid YAML until Helm renders them. The Helm
          # step below validates them properly.
          uv run --frozen --with pyyaml python - <<'PY'
          import subprocess, sys, yaml

          files = subprocess.run(
              ["git", "ls-files", "*.yml", "*.yaml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          files = [f for f in files if not f.startswith("helm-chart/templates/")]

          failed = []
          for f in files:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}")
                  failed.append(f)

          if failed:
              sys.exit(f"unparseable YAML: {failed}")
          PY

      - name: Parse every JSON file
        run: |
          uv run --frozen python - <<'PY'
          import json, subprocess, sys

          files = subprocess.run(
              ["git", "ls-files", "*.json"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = []
          for f in files:
              try:
                  with open(f) as fh:
                      json.load(fh)
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}")
                  failed.append(f)

          if failed:
              sys.exit(f"unparseable JSON: {failed}")
          PY

      - name: Lint and render the Helm chart
        run: |
          # `helm lint` catches schema and convention problems; `helm template`
          # actually executes the Go templates, which is the only way to catch
          # errors like a `with` block rebinding `.` to the wrong object.
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint ./helm-chart
          helm template ci-release ./helm-chart > /dev/null
          echo "helm chart renders cleanly"

      - name: Validate the TLS nginx config
        run: |
          # The certificate is generated into a temp directory rather than the
          # repo, so this check cannot clobber the committed cert.
          #
          # --add-host is required: the upstreams are host.docker.internal, and
          # nginx refuses to start when an upstream name does not resolve.
          mkdir -p /tmp/tls-check
          cp infrastructure/tls/nginx.conf /tmp/tls-check/
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "/tmp/tls-check:/etc/nginx/certs" \
            -v "/tmp/tls-check/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine sh -c '
              apk add --no-cache openssl >/dev/null 2>&1
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/nginx/certs/server.key \
                -out /etc/nginx/certs/server.crt \
                -subj "/CN=localhost" >/dev/null 2>&1
              nginx -t
            '

  # ---------------------------------------------------------------- docs
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check for stale metrics and overclaims
        run: python .github/scripts/check_docs.py

      - name: Check Grafana dashboards reference real metrics
        run: python .github/scripts/check_grafana.py

      - name: Check the repository is self-contained
        run: python .github/scripts/check_selfcontained.py

  # ------------------------------------------------------------ terraform
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # `fmt -check` catches formatting drift. `init -backend=false` resolves the
      # provider schema without contacting the Azure state backend, so this job
      # needs no cloud credentials. `validate` then type-checks every resource
      # against that schema, which is what catches a wrong argument name in a
      # module that nothing would notice until apply.
      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: terraform init and validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform

  # ------------------------------------------------------------ summary
  # Single required status check. Branch protection points at this job, so
  # adding or renaming a job above never silently drops a required check.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, security, shell, yaml, docs, terraform, lockfile]
    if: always()
    steps:
      - name: Report
        run: |
          echo "test:      ${{ needs.test.result }}"
          echo "security:  ${{ needs.security.result }}"
          echo "shell:     ${{ needs.shell.result }}"
          echo "yaml:      ${{ needs.yaml.result }}"
          echo "terraform: ${{ needs.terraform.result }}"
          echo "docs:      ${{ needs.docs.result }}"
          if [ "${{ needs.test.result }}" != "success" ] ||
             [ "${{ needs.security.result }}" != "success" ] ||
             [ "${{ needs.shell.result }}" != "success" ] ||
             [ "${{ needs.yaml.result }}" != "success" ] ||
             [ "${{ needs.terraform.result }}" != "success" ] ||
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."

  # ---------------------------------------------------------------- image
  image:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    # The deploy workflow only runs on a tag, so a broken Dockerfile could sit
    # on main indefinitely. This job builds the image and asserts the container
    # actually answers on /, which is what caught three separate defects:
    # a CMD pointing at a module that does not exist, pip's --prefix layout
    # landing packages where Python never looks, and a missing libxcb.so.1.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ci-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and serves
        run: |
          docker run -d --name ci-image -p 18000:8000 \
            -e API_KEY=ci-probe-key ci-image:latest
          for _ in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:18000/; then
              echo "Container answered on /"
              docker rm -f ci-image >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container did not answer on / within 90s"
          docker logs ci-image || true
          docker rm -f ci-image >/dev/null 2>&1 || true
          exit 1

      - name: Authentication is enforced
        run: |
          docker run -d --name ci-auth -p 18001:8000 \
            -e API_KEY=ci-probe-key ci-image:latest
          for _ in $(seq 1 45); do
            curl -sf -o /dev/null http://127.0.0.1:18001/ && break
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18001/predict)
          docker rm -f ci-auth >/dev/null 2>&1 || true
          if [ "$code" != "401" ]; then
            echo "::error::Expected 401 without an API key, got $code"
            exit 1
          fi
          echo "Unauthenticated /predict correctly rejected with 401"

  # ---------------------------------------------------------------- audit
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Deliberately not in the test matrix. pip-audit shells out to pip inside a
    # throwaway venv, and uv's managed CPython 3.10 build ships without
    # ensurepip, so the audit dies with CalledProcessError on 3.10 only. The
    # finding set is a property of uv.lock, not of the interpreter, so auditing
    # once on 3.11 covers both matrix legs.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Dependency vulnerability scan with pip-audit
        run: |
          # Audit the resolved set from uv.lock, which is what actually ships.
          # --no-hashes because pip-audit resolves the file with pip, which
          # rejects the +cpu local version that [tool.uv.sources] pins for torch.
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt -o /tmp/audit.txt
          grep -vE "^(torch|torchvision|torchaudio)==" /tmp/audit.txt > /tmp/audit-clean.txt

          # Blocking: a new vulnerability fails the build. The ignore list is the
          # only way to accept a known finding, and each entry must say why it is
          # not reachable. An unexplained entry is a bug.
          uv run --python 3.11 --with pip-audit pip-audit -r /tmp/audit-clean.txt \
            --format=json --output=pip-audit-report.json \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
          uv run --python 3.11 --with pip-audit pip-audit -r /tmp/audit-clean.txt --desc \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- lockfile
  lockfile:
    name: Lock file in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # uv.lock is the actual install source (CI, Docker and local all use
      # `uv sync`), so drift here is a real reproducibility failure rather than
      # a cosmetic one. --check exits non-zero when pyproject.toml and uv.lock
      # disagree, which means a dependency change was committed without
      # re-locking.
      - name: Verify uv.lock matches pyproject.toml
        run: |
          uv lock --check --python 3.11
          echo "uv.lock matches pyproject.toml"
