name: CI

# Run on push and pull request to main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10" ]
    env:
      # Job-level, because the `secrets` context is not available in a
      # step-level `if:` expression. Setting it here lets the upload step test
      # `env.CODECOV_TOKEN` and skip cleanly when the secret is absent.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not integration" --maxfail=5 --disable-warnings \
            --cov=src --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=52

      # codecov-action v4 requires a token for private repositories. The
      # upload is skipped when CODECOV_TOKEN is not configured, so a fork or a
      # private clone without the secret still gets a green build — the
      # coverage gate above is what actually enforces the floor.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ---------------------------------------------------------------- docs
  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check for stale metrics and overclaims
        run: python .github/scripts/check_docs.py
