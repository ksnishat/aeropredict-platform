name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level env, because the `secrets` context is not available in a
      # step-level `if:` expression.
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The kubeconfig must be written to disk before kubectl runs, and kubectl
      # must be installed. The previous version passed KUBE_CONFIG_DATA as an
      # env var only, so kubectl had no cluster to talk to. It also gated the
      # step on `if: env.DEPLOY_K8S`, but step-level `env:` is not available to
      # that step's own `if:` expression, so the condition never evaluated true.
      - name: Install kubectl
        if: env.KUBE_CONFIG_DATA != ''
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0

      - name: Write kubeconfig
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy to Kubernetes
        if: env.KUBE_CONFIG_DATA != ''
        run: |
          echo "Deploying aeropredict-api..."
          kubectl set image deployment/aeropredict-api \
            aeropredict-api=ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

      - name: Update deployment status
        run: |
          echo "Deployment complete!"
          echo "Tag: ${{ steps.meta.outputs.version }}"