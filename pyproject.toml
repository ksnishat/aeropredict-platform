[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeropredict-platform"
version = "1.0.0"
description = "Production-grade MLOps + GenAI platform for aircraft engine RUL prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Khaled Saifullah", email = "ksnishaat@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyspark>=3.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.7.1",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=5.6.0,<6.0.0",
    "bentoml>=1.2.0",
    "torch",
    "pytorch-lightning",
    "matplotlib",
    "flask",
    "flask-admin",
    "langchain-core>=0.2.0",
    "python-json-logger",
    "packaging",
    # Streaming feature pipeline: Kafka client and the online feature store.
    # Both are imported by src/streaming.py, so they must be declared or a
    # clean install fails at import time.
    "kafka-python-ng>=2.2.0",
    "redis>=5.0.0",
    "pysqlite3-binary; python_version < '3.9'",
    "apache-airflow-providers-apache-spark",
    "apache-airflow-providers-amazon",
    "python-multipart",
    "httpx",
    "slowapi==0.1.10",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
aeropredict-api = "src.api:app"
aeropredict-train = "src.train_model:train"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
# The Airflow image runs Python 3.8, so the DAG-imported modules must stay
# 3.8-compatible. Targeting 3.10 here let ruff *rewrite* Optional[str] into
# `str | None`, which is a runtime TypeError on 3.8 — the DAG then failed with
# "unsupported operand type(s) for |: 'type' and 'NoneType'". Targeting the
# lowest supported version keeps the linter from reintroducing that bug.
target-version = "py38"
# Notebooks re-import the same names in each cell, which is normal in Jupyter
# but trips F811. They are not linted.
extend-exclude = ["notebooks", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# B008: FastAPI requires File(...)/Depends(...) in argument defaults.
# C408: dict() calls in Dash layout definitions are intentional.
# UP006/UP035/UP045: these rewrite typing.List/dict/Optional into PEP 585/604
# syntax, which is evaluated at runtime and fails on Python 3.8.
ignore = ["E501", "B008", "C408", "UP006", "UP035", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires the live docker stack (set LIVE_STACK=1)",
]

# --- uv -------------------------------------------------------------------
# uv is the resolver and installer for this project. `uv sync` installs the
# locked set; `uv lock` regenerates it. The CPU wheel index is declared here
# because PEP 508 has no syntax for an index URL, which is why the serving
# image previously needed a separate requirements-serve.txt.
[tool.uv]
# The default PyPI index plus the CPU-only torch wheels. `unsafe-best-match`
# lets uv consider both indexes for the same package, which is required for
# torch: PyPI carries the CUDA build, the pytorch index carries +cpu.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = false

[tool.uv.sources]
# Pin torch and torchvision to the CPU index so a serving install never pulls
# the 3.2 GB of nvidia wheels that the default PyPI build drags in.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
